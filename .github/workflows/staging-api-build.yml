name: 'Staging API Build'

on:
  push:
    branches: ['develop']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: 'Deploy'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          ref: develop

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: hra-api
          IMAGE_TAG: staging
          CDN_URL: https://cdn.humanatlas.io/hra-kg--staging/
          GHCR_REGISTRY: ghcr.io
          GHCR_REPOSITORY: x-atlas-consortia/hra-api
        run: |
          docker build --build-arg CDN_URL=$CDN_URL \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $GHCR_REGISTRY/$GHCR_REPOSITORY:$IMAGE_TAG \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $GHCR_REGISTRY/$GHCR_REPOSITORY:$IMAGE_TAG
