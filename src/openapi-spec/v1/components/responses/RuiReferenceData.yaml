description: Successful operation. RUI Reference Data.
content:
  application/json:
    schema:
      title: RUI Reference Data
      type: object
      properties:
        organIRILookup:
          description: Reference organ IRIs keyed by "organ label|sex|side"
          type: object
          additionalProperties:
            type: string
        organSpatialEntities:
          description: Reference organ spatial entities keyed by reference organ IRI
          type: object
          additionalProperties: true
        anatomicalStructures:
          description: Anatomical structures (spatial entities) of each reference organ, keyed by reference organ IRI
          type: object
          additionalProperties: true
        extractionSets:
          description: Extraction sets of each reference organ, keyed by reference organ IRI
          type: object
          additionalProperties: true
        sceneNodeLookup:
          description: Scene nodes keyed by IRI
          type: object
          additionalProperties: true
        simpleSceneNodeLookup:
          description: Simplified scene nodes keyed by IRI
          type: object
          additionalProperties: true
        placementPatches:
          description: Direct placements onto the current reference organs for other (e.g., older) spatial entities, keyed by the source IRI
          type: object
          additionalProperties: true
      additionalProperties: true
