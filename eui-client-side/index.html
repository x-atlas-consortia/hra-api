<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Human Reference Atlas Exploration User Interface (EUI)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Registers the HRA API service worker (before <base>, so that it is loaded from this directory) -->
  <script src="sw-loader.js"></script>
  <base href="https://cdn.humanatlas.io/ui/ccf-eui/">
  <link href="https://cdn.humanatlas.io/ui/ccf-eui/styles.css" rel="stylesheet">
  <script src="https://cdn.humanatlas.io/ui/ccf-eui/wc.js" type="module"></script>
</head>
<body>
  <ccf-eui login-disabled="true" logo-tooltip=""></ccf-eui>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const eui = document.querySelector('ccf-eui');
      eui.homeUrl = location.href;
      // The service worker answers the API requests to <origin>/api/...
      eui.remoteApiEndpoint = location.origin + '/api';
    });
  </script>
</body>
</html>
